[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project"
version = "0.1.0"
description = "AI HR Support Assistant: validated HR support ticket parsing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "openai>=1.50,<3",
    "python-dotenv>=1.0,<2",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
    "markdown-it-py>=3,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8,<10"]
corpus = ["python-docx>=1.1,<2", "reportlab>=4,<5", "pypdf>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
ai-project = "ai_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


