name: Offline quality gates
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and corpus dependencies
        run: python -m pip install -e ".[dev,corpus]"
      - name: Create pytest temporary directory parent
        run: python -c "from pathlib import Path; Path('tmp').mkdir(parents=True, exist_ok=True)"
      - name: Tests including offline retrieval and ACL01
        run: python -m pytest -q
      - name: Replay saved RAG outputs with current scorers
        if: success() || failure()
        run: python -m ai_project ci-rag
